<style>
/* Page base: the explorer was first built as a hosted page that came with these defaults. */
:root{color-scheme:light}
body{margin:0;font:14px system-ui}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one full-bleed 3D stage. A slim chapter bar on top, one story card that always says what to look at
   (left column on wide screens, bottom sheet on phones). The 3D view re-centres itself in the space the card leaves free. */
:root{
  --bg:#EDF0F7; --bg-deep:#D6DCEA; --ink:#141D36; --ink-2:#47526F; --ink-3:#737D9B;
  --panel:rgba(255,255,255,.90); --panel-solid:#FFFFFF; --panel-edge:rgba(20,29,54,.11); --chip:#E6EAF4; --chip-ink:#2B3555;
  --oxy:#DD4239; --deoxy:#4643CC; --plant:#0B8576; --sugar:#B97F00; --water:#1478C9; --accent:#4340C4; --accent-ink:#FFFFFF;
  --good:#0B8576; --good-bg:#DDF3EF; --bad:#BF372D; --bad-bg:#FCE5E2;
  --f-display:"Gabarito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-text:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 18px 40px -22px rgba(20,29,54,.5),0 2px 8px rgba(20,29,54,.08);
  --r-card:20px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B35; --bg-deep:#060A16; --ink:#EEF1FB; --ink-2:#B6BED8; --ink-3:#8790AE;
    --panel:rgba(20,27,49,.88); --panel-solid:#18203B; --panel-edge:rgba(255,255,255,.11); --chip:#262F55; --chip-ink:#DCE2F5;
    --oxy:#FF6D63; --deoxy:#9592FF; --plant:#32C7B1; --sugar:#FFC445; --water:#5BB8FF; --accent:#8F8CFF; --accent-ink:#0E1430;
    --good:#32C7B1; --good-bg:#123A3A; --bad:#FF7D72; --bad-bg:#46222A;
    --shadow:0 20px 44px -20px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141B35; --bg-deep:#060A16; --ink:#EEF1FB; --ink-2:#B6BED8; --ink-3:#8790AE;
  --panel:rgba(20,27,49,.88); --panel-solid:#18203B; --panel-edge:rgba(255,255,255,.11); --chip:#262F55; --chip-ink:#DCE2F5;
  --oxy:#FF6D63; --deoxy:#9592FF; --plant:#32C7B1; --sugar:#FFC445; --water:#5BB8FF; --accent:#8F8CFF; --accent-ink:#0E1430;
  --good:#32C7B1; --good-bg:#123A3A; --bad:#FF7D72; --bad-bg:#46222A;
  --shadow:0 20px 44px -20px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.35); color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(115% 90% at 66% 36%,var(--bg) 0%,var(--bg-deep) 100%)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage.grabbing{cursor:grabbing}
#stage.pickable{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
#tint{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0}

/* chapter bar */
#bar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
#bar>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;flex:none;line-height:1}
.brand b{font:800 18px/1 var(--f-display);letter-spacing:-.01em}
.brand span{font:700 11px/1 var(--f-text);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
#chapters{display:flex;gap:4px;padding:5px;min-width:0;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--panel-edge);border-radius:var(--r-pill);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#chapters::-webkit-scrollbar{display:none}
#chapters button{flex:none;display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-2);font:700 13.5px/1 var(--f-text);padding:7px 13px 8px 7px;border-radius:var(--r-pill);cursor:pointer;transition:background .25s,color .25s}
#chapters button:hover{background:var(--chip)}
#chapters button i{font:800 11.5px/1 var(--f-display);font-style:normal;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-ink)}
#chapters button[aria-current="true"]{background:var(--ink);color:var(--panel-solid)}
#chapters button[aria-current="true"] i{background:var(--panel-solid);color:var(--ink)}
#chapters button.done i{background:var(--good);color:var(--panel-solid)}
.tools{margin-left:auto;display:flex;gap:8px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--panel-edge);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.icon-btn svg{width:19px;height:19px}

/* colour key */
#legend{position:absolute;right:16px;top:calc(68px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.key{display:flex;align-items:center;gap:8px;font:700 12.5px/1 var(--f-text);color:var(--ink-2);background:var(--panel);padding:7px 12px 7px 9px;border-radius:var(--r-pill);border:1px solid var(--panel-edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.key i{width:12px;height:12px;border-radius:50%;flex:none}
.key.note{font-weight:600;font-size:11.5px;color:var(--ink-3)}

/* story card */
#card{position:absolute;z-index:6;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100% - 32px));max-height:calc(100% - 96px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:18px 20px 16px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:var(--r-card);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
#kicker{font:700 11.5px/1.2 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
#dots{display:flex;gap:5px;flex:none}
#dots button{width:9px;height:9px;padding:0;border:0;border-radius:5px;background:var(--chip);cursor:pointer;transition:width .3s,background .3s}
#dots button.on{width:22px;background:var(--accent)}
#dots button.seen{background:var(--ink-3)}
#stepTitle{margin:0;font:800 24px/1.1 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
#stepText{margin:0;font:500 15.5px/1.5 var(--f-text);color:var(--ink-2);max-width:62ch;text-wrap:pretty}
#stepText b{color:var(--ink);font-weight:800}
.t-oxy{color:var(--oxy);font-weight:800}.t-deoxy{color:var(--deoxy);font-weight:800}.t-plant{color:var(--plant);font-weight:800}
.t-water{color:var(--water);font-weight:800}.t-sugar{color:var(--sugar);font-weight:800}
#stepCtl{display:flex;flex-direction:column;gap:10px}
#stepCtl:empty{display:none}
.card-nav{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:var(--r-pill);border:1px solid var(--panel-edge);background:var(--chip);color:var(--ink);font:800 14.5px/1 var(--f-text);cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;flex:1}
.btn.small{min-height:36px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:16px;height:16px}
.mini{font:600 12.5px/1.45 var(--f-text);color:var(--ink-3);margin:0}

/* step controls */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slider{display:flex;flex-direction:column;gap:6px}
.slider label{display:flex;justify-content:space-between;font:700 13px/1 var(--f-text);color:var(--ink-2)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0;cursor:pointer}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.readout div{background:var(--chip);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.readout b{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout span{font:600 12px/1.25 var(--f-text);color:var(--ink-2)}
.route{display:flex;flex-wrap:wrap;gap:5px}
.route span{font:700 12px/1 var(--f-text);padding:6px 9px 7px;border-radius:var(--r-pill);background:var(--chip);color:var(--ink-3);transition:background .35s,color .35s,box-shadow .35s}
.route span.done{color:var(--ink-2)}
.route span.now{color:#fff;background:var(--c);box-shadow:0 4px 12px -4px var(--c)}
.route span.deoxy{--c:var(--deoxy)}.route span.oxy{--c:var(--oxy)}
.route span.mix{--c:var(--accent)}
.narr{font:700 14.5px/1.4 var(--f-text);color:var(--ink);min-height:2.8em;margin:0}
.narr em{font-style:normal;color:var(--ink-3);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.phases div{position:relative;overflow:hidden;border-radius:10px;padding:8px 9px 11px;background:var(--chip);font:700 12.5px/1.2 var(--f-text);color:var(--ink-3);transition:background .2s,color .2s;min-width:0}
.phases div b{display:block;font:800 14px/1.1 var(--f-display);color:var(--ink-2);margin-bottom:2px}
.phases div.on{background:var(--ink);color:var(--panel-solid)}
.phases div.on b{color:var(--panel-solid)}
.phases div i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent)}
.sound{display:flex;gap:8px;align-items:center;font:800 15px/1 var(--f-display);color:var(--ink-3);min-height:20px}
.sound span{opacity:.25;transition:opacity .2s,transform .2s;color:var(--accent)}
.sound span.on{opacity:1;transform:scale(1.15)}
.seg{display:inline-flex;background:var(--chip);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:var(--r-pill);font:800 13px/1 var(--f-text);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.info{display:flex;gap:12px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:11px 13px}
.info .sw{width:30px;height:30px;border-radius:50%;flex:none;margin-top:2px}
.info b{display:block;font:800 15px/1.2 var(--f-display);margin-bottom:2px}
.info p{margin:0;font:600 13.5px/1.42 var(--f-text);color:var(--ink-2)}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.ladder button{border:1px solid var(--panel-edge);background:var(--chip);border-radius:12px;padding:8px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 12px/1.1 var(--f-text);color:var(--ink-2);min-width:0}
.ladder button small{font:600 10.5px/1.15 var(--f-text);color:var(--ink-3);text-align:center}
.ladder button[aria-pressed="true"]{background:var(--plant);color:#fff;border-color:transparent}
.ladder button[aria-pressed="true"] small{color:#E9FFFA}
.toggles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tog{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px 8px;border-radius:14px;border:1px solid var(--panel-edge);background:var(--chip);color:var(--ink-2);font:800 12px/1 var(--f-text);cursor:pointer;transition:background .25s,color .25s}
.tog svg{width:22px;height:22px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--panel-solid)}
.meter{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--chip);border-radius:14px;padding:11px 13px}
.meter b{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums;grid-row:span 2}
.meter span{font:700 12px/1.2 var(--f-text);color:var(--ink-2)}
.meter .bar{height:10px;border-radius:5px;background:var(--panel-solid);overflow:hidden}
.meter .bar i{display:block;height:100%;width:30%;background:var(--water);border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stoma{display:flex;align-items:center;gap:10px;font:700 12.5px/1.3 var(--f-text);color:var(--ink-2)}
.stoma svg{width:46px;height:34px;flex:none}
.check{border-radius:14px;padding:12px 14px;background:var(--chip);font:700 14px/1.45 var(--f-text);color:var(--ink)}
.check.good{background:var(--good-bg)}.check.bad{background:var(--bad-bg)}
.check .ck{display:block;font:800 15px/1.2 var(--f-display);margin-bottom:3px}
.check.good .ck{color:var(--good)}.check.bad .ck{color:var(--bad)}
.check b{font-weight:800}
.tap{display:inline-flex;align-items:center;gap:8px;font:800 13px/1 var(--f-text);color:var(--accent)}
.tap i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 12px transparent}}

/* labels pinned to the 3D model */
.lab{position:absolute;width:0;height:0;opacity:0;transition:opacity .45s ease}
.lab.on{opacity:1}
.lab .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2.5px var(--panel-solid)}
.lab .ln{position:absolute;left:0;top:-.75px;height:1.5px;background:var(--ink);opacity:.5;transform-origin:0 50%}
.lab .pill{position:absolute;left:0;top:0;width:max-content;max-width:290px;white-space:normal;font:800 13.5px/1.15 var(--f-text);color:var(--ink);background:var(--panel-solid);border:1px solid var(--panel-edge);padding:6px 11px 7px;border-radius:11px;box-shadow:var(--shadow)}
.lab .pill small{display:block;font:600 11.5px/1.25 var(--f-text);color:var(--ink-2);margin-top:2px}
.lab.oxy .dot{background:var(--oxy)}.lab.deoxy .dot{background:var(--deoxy)}.lab.plant .dot{background:var(--plant)}
.lab.water .dot{background:var(--water)}.lab.sugar .dot{background:var(--sugar)}.lab.warn .dot{background:var(--accent)}.lab.grey .dot{background:#7D86A6}
.lab.oxy .pill{border-left:3px solid var(--oxy)}.lab.deoxy .pill{border-left:3px solid var(--deoxy)}
.lab.side .pill{font:900 16px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;background:transparent;border:0;box-shadow:none;color:var(--ink-2);padding:0}
.lab.side .pill small{font:700 12px/1.2 var(--f-text);letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:4px}
.lab.nodot .dot,.lab.nodot .ln{display:none}
.lab.pop .pill{font:900 22px/1 var(--f-display);color:var(--accent);background:transparent;border:0;box-shadow:none;letter-spacing:.02em}
.lab.follow .pill{background:var(--ink);color:var(--panel-solid);border:0}

#hint{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;font:700 12.5px/1 var(--f-text);color:var(--ink-3);background:var(--panel);border:1px solid var(--panel-edge);padding:9px 13px;border-radius:var(--r-pill);transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
#flash{position:absolute;inset:0;z-index:4;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .3s ease}
#flash.on{opacity:1}
#loading{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);transition:opacity .6s}
#loading.gone{opacity:0;pointer-events:none}
#loading div{display:flex;flex-direction:column;align-items:center;gap:14px;font:700 15px/1.4 var(--f-text);color:var(--ink-2);text-align:center;padding:0 24px}
#loading i{width:44px;height:44px;border-radius:50%;border:4px solid var(--chip);border-top-color:var(--oxy);border-right-color:var(--deoxy);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:899px){
  #card{left:16px;right:16px;width:auto;max-height:46%;padding:14px 16px 12px;gap:9px}
  #stepTitle{font-size:20px}
  #stepText{font-size:14.5px;line-height:1.45}
  .brand span{display:none}
  #legend{top:calc(62px + env(safe-area-inset-top,0px));left:16px;right:16px;flex-direction:row;justify-content:flex-end;flex-wrap:wrap}
  .key{font-size:11.5px;padding:6px 10px 6px 8px}
  .key.note{display:none}
  #hint{display:none}
  .lab .pill{font-size:12px;padding:5px 9px 6px;max-width:190px}
  .lab .pill small{font-size:10.5px}
}
@media (max-width:560px){
  .brand{display:none}
  #chapters button{padding:7px 9px 8px 7px}
  #chapters button span{display:none}
  #chapters button[aria-current="true"] span{display:inline}
  .readout b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .tap i{animation:none}
  #dots button,.route span,#flash{transition:none}
}
</style>
</head>
<body>
<noscript><div style="position:fixed;left:0;right:0;bottom:28px;z-index:20;text-align:center;font:600 15px/1.4 system-ui;color:var(--ink,#141D36)">This explorer needs JavaScript and WebGL. Please turn JavaScript on and reload.</div></noscript>
<div id="app">
  <canvas id="stage" aria-label="Interactive 3D model. Drag to turn it, scroll or pinch to zoom." tabindex="0"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="tint"></div>
  <header id="bar">
    <div class="brand"><b>Transport systems</b><span>Year 8 science · 3D</span></div>
    <nav id="chapters" aria-label="Chapters"></nav>
    <div class="tools">
      <button class="icon-btn" id="resetView" title="Reset the view" aria-label="Reset the view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </header>
  <aside id="legend" aria-label="Colour key"></aside>
  <section id="card" aria-live="polite">
    <div class="card-head"><span id="kicker"></span><div id="dots" role="tablist" aria-label="Steps"></div></div>
    <h2 id="stepTitle"></h2>
    <p id="stepText"></p>
    <div id="stepCtl"></div>
    <div class="card-nav">
      <button class="btn" id="back" aria-label="Previous step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
      <button class="btn primary" id="next">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>

    const base = pos.length / 3;

  }

    for (let j = 0; j <= nth; j++) { const th = Math.PI * j / nth; pos.push(x, Math.cos(th) * rI(x), -Math.sin(th) * rI(x), x, Math.cos(th) * rO(x), -Math.sin(th) * rO(x)); nor.push(sx, 0, 0, sx, 0, 0); }

}

// ============================================================== chapter 3: blood vessels
function chVessels() {

  // ---- the vessels, cut open towards the viewer

  const mm = (c, o = {}) => tissue(c, Object.assign({ roughness: 0.55, clearcoat: 0.25, sheen: 0.4 }, o));

  const st = { t: 0, sq: 0, sqT: 0, period: 1.0, squeezeNow: false };
  function updateCells(dt) {

      const c = cells[i];

      if (!c.main && c.x > X.a1 - 0.4 && c.x < X.v0) { c.x = X.v0 + 0.05; c.s = 0; }
      if (c.x > X.v1) { c.x = X.a0; c.s = 0; }

  const stP = new THREE.Group(), stL = new THREE.Group(), stK = new THREE.Group(); G.add(stP, stL, stK);

  const R = rng(31);
  const tA = V3(), tT = V3(), tN = V3(), tB = V3();

  // ===================================================== the whole plant

  const soilSide = new THREE.MeshStandardMaterial({ color: '#7A5B3E', roughness: 1, side: THREE.DoubleSide });

  soil.position.set(0, -2.2, 0); soil.renderOrder = 1; stP.add(soil);

  // ---- roots
  const mainRoot = new Path([[0, -0.02, 0], [0.08, -1.0, 0.05], [0.05, -2.0, 0.12], [0.12, -3.0, 0.2], [0.2, -3.95, 0.25]], { density: 10 });

  for (const [t0, end] of [[0.16, [-3.4, -1.6, 0.6]], [0.3, [3.5, -2.0, -0.5]], [0.47, [-3.1, -3.2, -0.6]], [0.62, [3.2, -3.6, 0.7]], [0.78, [-1.7, -4.05, 0.9]]]) {
    const a = mainRoot.at(t0, V3()), e = V3(...end), m = a.clone().lerp(e, 0.45).add(V3(0, 0.3, 0));
    roots.push({ path: new Path([a, m, e], { density: 12 }), r: 0.065, main: false, t0 });
  }
  const rootMat = tissue(C.root, { roughness: 0.55, transparent: true, opacity: 1 });

  // root hair cells: long thin outgrowths near each tip

  { let i = 0; const up = V3(0, 1, 0), q = new THREE.Quaternion(), m = new THREE.Matrix4();

    } }
  stP.add(hairs);
  ch.glow.add('hairs', hairs.material); ch.glow.add('roots', rootMat);
  const FH = (() => {
    const r = roots[4], t = 0.78; r.path.at(t, tA); r.path.frame(t, tT, tN, tB);
    const a = Math.atan2(tB.z, tN.z), d = tN.clone().multiplyScalar(Math.cos(a)).addScaledVector(tB, Math.sin(a)).normalize();
    const base = tA.clone().addScaledVector(d, r.r * 0.8), tip = base.clone().addScaledVector(d, 0.75);
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.72, 6, 12), tissue('#FFFFFF', { roughness: 0.4, emissive: col('#FFF6DD'), emissiveIntensity: 0.35 }));
    m.position.copy(base).addScaledVector(d, 0.375); m.quaternion.setFromUnitVectors(V3(0, 1, 0), d); stP.add(m);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTexture('rgba(120,200,255,0.75)'), transparent: true, depthWrite: false }));
    halo.position.copy(base).addScaledVector(d, 0.4); halo.scale.setScalar(1.3); halo.visible = false; stP.add(halo);
    return { base, tip, d, core: tA.clone(), halo };
  })();
  const NDROP = 6, drops = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 12, 10), new THREE.MeshPhysicalMaterial({ color: C.water, roughness: 0.2, clearcoat: 1, emissive: col('#4AA8FF'), emissiveIntensity: 0.3 }), NDROP);
  drops.frustumCulled = false; stP.add(drops); drops.visible = false;
  const dropT = Array.from({ length: NDROP }, (_, i) => i / NDROP);
  function updateDrops(dt) {
    for (let i = 0; i < NDROP; i++) {
      dropT[i] = (dropT[i] + dt * 0.35) % 1; const t = dropT[i];

      text: 'Cells make tissues, tissues make organs, organs make organ systems, and organ systems make the whole plant. Tap a level to zoom.',
      cam: camWhole, labels: ['oOrganism'], focus: [],
      enter: () => { show('P'); setFlows(false, false); setXray(false); setBrackets('organism'); },
      exit: () => setBrackets(''),
      ctl: (el, api) => {
        el.innerHTML = `<div class="ladder" role="group" aria-label="Levels of organisation">${LEVELS.map(l => `<button data-k="${l.k}" aria-pressed="false">${l.name}<small>${l.ex}</small></button>`).join('')}</div><p class="mini" id="lvNote"></p>`;
        const pickLv = async (k, instant) => {
          const L = LEVELS.find(l => l.k === k);
          el.querySelectorAll('.ladder button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
          el.querySelector('#lvNote').innerHTML = L.note;
          if (L.stage !== stage) { await api.flash(() => show(L.stage)); }
          api.labels(L.labels); ch.glow.set(L.focus); setBrackets(k); flyTo(L.cam, instant ? 0 : 1.3, instant);
        };
        el.querySelectorAll('.ladder button').forEach(b => (b.onclick = () => pickLv(b.dataset.k)));
        el.querySelector('#lvNote').innerHTML = LEVELS[4].note;
        el.querySelector('.ladder button[data-k="organism"]').setAttribute('aria-pressed', 'true');
        return () => show('P');
      },
    },
    {
      title: 'Water in, through the root hairs',
      text: '<b>Root hair cells</b> take in <span class="t-water">water</span> from the soil by <b>osmosis</b>. They take in mineral ions too, by a different process. Each long, thin hair gives a big surface area.',
      cam: { t: [FH.tip.x - 0.3, FH.tip.y + 0.2, FH.tip.z], dir: [0.1, 0.16, 1], w: 4.2, h: 2.9 }, labels: ['pHair', 'pOsm'], focus: [],
      enter: () => { show('P'); setFlows(true, false); setXray(true); drops.visible = FH.halo.visible = true; },
      exit: () => { drops.visible = FH.halo.visible = false; },
    },
    {
      title: 'Up the stem, in the xylem',
      text: '<span class="t-water">Xylem</span> vessels are hollow tubes of dead cells with no end walls, strengthened with lignin. They carry water and mineral ions <b>upwards only</b>.',
      cam: { t: [0, 2.3, 0], dir: [0.22, 0.1, 1], w: 4.6, h: 5.8 }, labels: ['pXylem'], focus: ['xylem'],
      enter: () => { show('P'); setFlows(true, false); setXray(true); },
    },
    {
      title: 'Xylem and phloem, up close',
      text: 'Cut open, the two transport tissues look very different. <span class="t-water">Xylem</span> is a hollow tube of dead cells with no end walls, made strong by lignin. <span class="t-sugar">Phloem</span> is made of living cells joined end to end by sieve plates.',
      cam: { t: [0.1, 0.2, 0], dir: [0.12, 0.08, 1], w: 9.5, h: 9.2 }, labels: ['xName', 'pName2', 'xDead', 'xNoEnd', 'xLig', 'pLive', 'pPlate', 'pComp'], focus: [],
      enter: () => api_flash(() => show('X')),
    },
    {
      title: 'Out through the leaves: transpiration',
      text: 'Inside the leaf, water <b>evaporates</b> into the air spaces. The vapour <b>diffuses</b> out through the <b>stomata</b>. This loss of water is <b>transpiration</b>, and it pulls more water up the xylem behind it.',
      cam: { t: [-1.0, -0.75, 1.8], dir: [0.3, 0.1, 1], w: 7.2, h: 4.4 }, labels: ['lAir', 'lStoma', 'lGuard', 'lXy'], focus: ['guard'],
      enter: () => api_flash(() => show('L')),
    },
    {
      title: 'Phloem carries sugar both ways',
      text: 'Leaves make sugar by photosynthesis. <span class="t-sugar">Phloem</span> carries it, dissolved, <b>up and down</b> the plant: to the flower, to growing tips and down to the roots.',
      cam: { t: [0, 1.4, 0], dir: [0.18, 0.12, 1], w: 9, h: 12.6 }, labels: ['pPhloem', 'pUp', 'pDown'], focus: ['phloem'],
      enter: () => { show('P'); setFlows(false, true); setXray(true, true); showChevrons(true); },
      exit: () => showChevrons(false),
    },
    {
      title: 'Experiment: what speeds up transpiration?',
      text: 'Change the conditions and watch the water vapour and the meter. Change one thing at a time to make it a fair test.',
      cam: { t: [0.2, 4.0, 0], dir: [0.14, 0.1, 1], w: 9.2, h: 8.2 }, labels: ['pVap'], focus: [],
      enter: () => { show('P'); setXray(true); setFlows(true, false); experiment = true; },
      exit: () => { experiment = false; resetEnv(); },
      ctl: el => {
        const icon = { light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
          warm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14.5V4.8a2 2 0 1 1 4 0v9.7a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></svg>',
          wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8.5h11a3 3 0 1 0-3-3"/><path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 16.5h7"/></svg>',
          humid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.4 6 10.6A6 6 0 0 1 6 13.6C6 9.4 12 3 12 3z"/></svg>' };
        const names = { light: 'Light', warm: 'Warm', wind: 'Windy', humid: 'Humid' };
        el.innerHTML = `<div class="toggles">${Object.keys(names).map(k => `<button class="tog" data-k="${k}" aria-pressed="${env[k]}">${icon[k]}${names[k]}</button>`).join('')}</div>`
          + `<div class="meter"><b id="rate">1.2</b><span>grams of water lost per hour</span><div class="bar"><i id="rateBar"></i></div></div>`
          + `<div class="stoma"><svg viewBox="0 0 46 34"><ellipse id="gL" cx="17" cy="17" rx="8" ry="14" fill="#2FA866"/><ellipse id="gR" cx="29" cy="17" rx="8" ry="14" fill="#2FA866"/><ellipse id="pore" cx="23" cy="17" rx="3.2" ry="10" fill="#1A2238"/></svg><span id="stTxt">In the light the stomata are open, so water vapour can escape.</span></div>`;
        const upd = () => {
          env.rate = rateOf(env);
          el.querySelector('#rate').textContent = env.rate.toFixed(1);
          el.querySelector('#rateBar').style.width = `${Math.min(100, (env.rate / 4) * 100).toFixed(0)}%`;
          el.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-pressed', env[b.dataset.k]));
          const open = env.light;
          el.querySelector('#pore').setAttribute('rx', open ? 3.2 : 0.4);
          el.querySelector('#gL').setAttribute('cx', open ? 17 : 19); el.querySelector('#gR').setAttribute('cx', open ? 29 : 27);
          el.querySelector('#stTxt').textContent = open ? 'In the light the stomata are open, so water vapour can escape.' : 'In the dark the stomata close, so very little water vapour escapes.';
          const dark = 'rgba(10,16,40,.42)', hot = 'radial-gradient(90% 80% at 75% 20%, rgba(255,140,40,.34), rgba(255,120,40,0) 70%)';
          TINT.set(!env.light ? (env.warm ? 'linear-gradient(rgba(10,16,40,.38),rgba(10,16,40,.38)), ' + hot : dark) : env.warm ? hot : 'transparent', env.warm || !env.light);
        };
        el.querySelectorAll('.tog').forEach(b => (b.onclick = () => { env[b.dataset.k] = !env[b.dataset.k]; upd(); }));
        upd();
        return () => resetEnv();
      },
    },
    {
      title: 'Quick check',
      text: 'Tap the part of the plant where <b>water gets in</b>.',
      cam: camWhole, labels: [], focus: [],
      enter: () => { show('P'); setFlows(false, false); setXray(false); },
      check: { answer: 'roots', pick: [hRoot, hStem, hFlower, ...hLeaves],
        yes: 'Yes: the <b>roots</b>. Root hair cells take in water from the soil by osmosis.',
        no: 'Water gets in through the <b>roots</b>: root hair cells take it in from the soil by osmosis.' },
      labelsAfter: ['oRoot'],
    },
  ];
  let api_flash = f => f();
  ch.bindApi = api => { api_flash = api.flash; };
  return ch;
}

// ============================================================== the story engine
const ui = {
  nav: $('#chapters'), kicker: $('#kicker'), dots: $('#dots'), title: $('#stepTitle'), text: $('#stepText'), ctl: $('#stepCtl'),
  back: $('#back'), next: $('#next'), legend: $('#legend'), flash: $('#flash'), hint: $('#hint'), loading: $('#loading'), tint: $('#tint'),
};
const store = {
  get() { try { return JSON.parse(localStorage.getItem('ts3d') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('ts3d', JSON.stringify(v)); } catch (e) { /* storage may be blocked: the page works without it */ } },
};
const saved = store.get();
const doneSet = new Set(saved.done || []);
let chapters = [], cur = null, ci = -1, si = -1, cleanup = null, check = null, stepCount = 0;

function flash(fn) {
  return new Promise(res => {
    ui.flash.classList.add('on');
    setTimeout(() => { fn(); requestAnimationFrame(() => requestAnimationFrame(() => { ui.flash.classList.remove('on'); res(); })); }, REDUCED ? 60 : 300);
  });
}
function showLabel(l, on) {
  if (!l) return;
  if (on) { l.visible = true; requestAnimationFrame(() => l.userData.el.classList.add('on')); }
  else { l.userData.el.classList.remove('on'); l.visible = false; }
}
function setLabels(keys = []) { if (!cur) return; for (const [k, l] of Object.entries(cur.labels)) showLabel(l, keys.includes(k)); }
const API = { flash, labels: setLabels };

function renderNav() {
  ui.nav.innerHTML = chapters.map((c, i) => `<button data-i="${i}" aria-current="${i === ci}" class="${doneSet.has(c.id) ? 'done' : ''}"><i>${doneSet.has(c.id) ? '✓' : i + 1}</i><span>${c.name}</span></button>`).join('');
  ui.nav.querySelectorAll('button').forEach(b => (b.onclick = () => goChapter(+b.dataset.i)));
  const curBtn = ui.nav.querySelector('[aria-current="true"]'); if (curBtn) curBtn.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function renderLegend() {
  const k = cur.legend, step = cur.steps[si];
  if (step && step.legend) { ui.legend.innerHTML = step.legend.map(([c, t]) => `<div class="key"><i style="background:${c}"></i>${t}</div>`).join(''); blockCache = null; return; }
  blockCache = null;
  ui.legend.innerHTML = k === 'blood'
    ? '<div class="key"><i style="background:var(--oxy)"></i>rich in oxygen</div><div class="key"><i style="background:var(--deoxy)"></i>low in oxygen</div><div class="key note">blue is only a diagram colour</div>'
    : k === 'plant'
      ? '<div class="key"><i style="background:var(--water)"></i>water</div><div class="key"><i style="background:var(--sugar)"></i>sugar</div>'
      : '';
}
function renderDots() {
  ui.dots.innerHTML = cur.steps.map((s, i) => `<button role="tab" aria-label="Step ${i + 1}: ${s.title}" aria-selected="${i === si}" class="${i === si ? 'on' : i < si ? 'seen' : ''}" data-i="${i}"></button>`).join('');
  ui.dots.querySelectorAll('button').forEach(b => (b.onclick = () => goStep(+b.dataset.i)));
}
function nextLabel() {
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
  if (si < cur.steps.length - 1) return 'Next' + arrow;
  if (ci < chapters.length - 1) return `Next: ${chapters[ci + 1].name}` + arrow;
  return 'Back to the start' + arrow;
}
function leaveStep() {
  if (!cur || si < 0) return;
  const s = cur.steps[si];
  if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
  try { s.exit?.(); } catch (e) { console.error(e); }
  check = null; canvas.classList.remove('pickable');
}
function goStep(j, instant = false) {
  j = clamp(j, 0, cur.steps.length - 1);
  leaveStep();
  si = j; const s = cur.steps[j];
  if (stepCount++ > 0) ui.hint.classList.add('gone');
  ui.kicker.textContent = `${cur.name} · step ${j + 1} of ${cur.steps.length}`;
  ui.title.textContent = s.title; ui.text.innerHTML = s.text;
  renderDots();
  ui.back.disabled = ci === 0 && j === 0;
  ui.next.innerHTML = nextLabel();
  setLabels(s.labels || []); cur.glow.set(s.focus || []); renderLegend();
  ui.ctl.innerHTML = '';
  try { s.enter?.(); } catch (e) { console.error(e); }
  if (s.ctl) { try { cleanup = s.ctl(ui.ctl, API) || null; } catch (e) { console.error(e); } }
  if (s.check) startCheck(s);
  layout();
  if (!s.follow) flyTo(s.cam, 1.35, instant);
  store.set({ ci, si, done: [...doneSet] });
}
async function goChapter(i, step = 0, instant = false) {
  if (i === ci) { goStep(step, instant); return; }
  const doSwitch = () => {
    if (cur) {
      leaveStep(); try { cur.exit?.(); } catch (e) { console.error(e); }
      cur.group.visible = false; for (const l of Object.values(cur.labels)) showLabel(l, false);
    }
    ci = i; cur = chapters[i]; cur.group.visible = true; si = -1;
    renderNav(); renderLegend();
    try { cur.enter?.(); } catch (e) { console.error(e); }
    goStep(step, true);
  };
  if (instant || !cur) doSwitch(); else await flash(doSwitch);
}
function next() { if (si < cur.steps.length - 1) goStep(si + 1); else goChapter((ci + 1) % chapters.length); }
function back() { if (si > 0) goStep(si - 1); else if (ci > 0) goChapter(ci - 1, chapters[ci - 1].steps.length - 1); }
ui.next.onclick = next; ui.back.onclick = back;
$('#resetView').onclick = () => { const s = cur.steps[si]; if (s.follow) return; flyTo(CAM.home || s.cam, 1.0); };

// ---- quick checks: tap the model
function startCheck(s) {
  check = { s, done: false };
  ui.ctl.innerHTML = '<div class="tap"><i></i>Tap your answer on the model</div>';
  canvas.classList.add('pickable');
}
function answer(key) {
  const s = check.s, ok = key === s.check.answer;
  ui.ctl.innerHTML = `<div class="check ${ok ? 'good' : 'bad'}"><span class="ck">${ok ? 'Correct' : 'Not quite'}</span>${ok ? s.check.yes : s.check.no}</div>`
    + (ok ? '' : '<div class="row"><button class="btn small" id="retry">Try again</button></div>');
  setLabels(s.labelsAfter || []);
  if (ok) { check.done = true; canvas.classList.remove('pickable'); doneSet.add(cur.id); renderNav(); store.set({ ci, si, done: [...doneSet] }); }
  else { check.done = true; canvas.classList.remove('pickable'); ui.ctl.querySelector('#retry').onclick = () => { setLabels([]); startCheck(s); layout(); }; }
  layout();
}

// ---- tapping the model
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; canvas.classList.add('grabbing'); ui.hint.classList.add('gone'); });
window.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  if (!down) return; const d = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (d > 7 || dt > 700 || e.target !== canvas) return;
  const s = cur && cur.steps[si]; if (!s) return;
  const objs = check && !check.done ? (s.check.pick || s.check.pickFn()) : s.pickAny ? s.pickAny() : null;
  if (!objs) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(objs, false)[0];
  if (!hit) return;
  const key = hit.object.userData.pick;
  if (check && !check.done) answer(key); else if (cur.onPick) cur.onPick(key);
});
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === 'ArrowRight') { next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { back(); e.preventDefault(); }
  else if (/^[1-5]$/.test(e.key)) goChapter(+e.key - 1);
});
window.addEventListener('resize', () => { layout(); const s = cur && cur.steps[si]; if (s && !s.follow && !CAM.busy) flyTo(CAM.home || s.cam, 0, true); });
new ResizeObserver(() => layout()).observe(cardEl);
setTimeout(() => ui.hint.classList.add('gone'), 12000);

// ---- boot
const pad = (r, p = 6) => ({ x0: r.left - p, x1: r.right + p, y0: r.top - p, y1: r.bottom + p });
let blockCache = null, blockAt = 0;
function blockers() {   // screen areas labels must not cover (refreshed a few times a second)
  const now = performance.now();
  if (blockCache && now - blockAt < 250) return blockCache;
  blockAt = now;
  blockCache = [cardEl, ui.nav, $('#resetView'), ...ui.legend.children].filter(e => e && e.offsetParent !== null).map(e => pad(e.getBoundingClientRect()));
  return blockCache;
}
window.addEventListener('resize', () => { for (const l of LABELS) l.userData.pw = 0; blockCache = null; });
document.fonts?.ready.then(() => { for (const l of LABELS) l.userData.pw = 0; blockCache = null; });   // label sizes change when the web fonts arrive
const clock = new THREE.Clock();
let fpsT = 0, fpsN = 0; const quality = { ups: 0 };
function frame() {
  requestAnimationFrame(frame);
  const real = Math.min(0.1, clock.getDelta());           // camera moves keep real time, even on a slow device
  const dt = Math.min(0.05, real) * (REDUCED ? 0.6 : 1), t = clock.elapsedTime;
  runTweens(real); TINT.update(real);
  if (cur) { try { cur.update(dt, t); } catch (e) { console.error(e); } cur.glow.update(dt, t); }
  controls.enabled = !CAM.follow;
  controls.update();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  layoutLabels(blockers());
  fpsN++; fpsT += real;
  if (fpsT > 1.5) {
    const fps = fpsN / fpsT; window.__fps = Math.round(fps); fpsN = 0; fpsT = 0;
    // keep it smooth on modest laptops: render fewer pixels when frames drop, more when there is headroom
    const pr = renderer.getPixelRatio(), maxPr = Math.min(devicePixelRatio || 1, 2);
    if (!document.hidden && fps < 38 && pr > 0.75) { renderer.setPixelRatio(Math.max(0.75, pr - 0.25)); layout(); }
    else if (fps > 57 && pr < maxPr && quality.ups < 3) { renderer.setPixelRatio(Math.min(maxPr, pr + 0.25)); quality.ups++; layout(); }
  }
}
function boot() {
  chapters = [chLoop(), chBlood(), chVessels(), chHeart(), chPlants()];
  for (const c of chapters) {
    scene.add(c.group); c.group.visible = false;
    c.showLabel = (k, on) => { if (c === cur) showLabel(c.labels[k], on); };
    c.bindApi?.(API);
  }
  layout();
  const fromHash = chapters.findIndex(c => '#' + c.id === location.hash);
  const startCh = fromHash >= 0 ? fromHash : clamp(saved.ci ?? 0, 0, chapters.length - 1);
  const startSt = fromHash >= 0 ? 0 : clamp(saved.si ?? 0, 0, chapters[startCh].steps.length - 1);
  goChapter(startCh, startSt, true);
  renderer.compile(scene, camera);
  frame();
  setTimeout(() => ui.loading.classList.add('gone'), 120);
  setTimeout(() => { ui.loading.hidden = true; }, 900);   // gone for good, even if the fade could not run
  window.__ready = true;
}
try { boot(); } catch (e) { console.error(e); document.getElementById('loadMsg').textContent = 'Something went wrong while building the 3D models: ' + e.message; }

</script>
